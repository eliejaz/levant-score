services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-levant_score}
      POSTGRES_USER: ${POSTGRES_USER:-levant}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-levant-dev-password}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - levant_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-levant} -d ${POSTGRES_DB:-levant_score}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-levant_score}
      DB_USER: ${POSTGRES_USER:-levant}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-levant-dev-password}
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-before-production-1234567890}
      DB_MAX_CONNECTIONS: ${DB_MAX_CONNECTIONS:-5}
      CORS_ORIGINS: http://localhost:5173,http://localhost:${FRONTEND_PORT:-3000}
      SERVER_PORT: 8080
    ports:
      - "${BACKEND_PORT:-27310}:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:${BACKEND_PORT:-27310}/api
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend

volumes:
  levant_postgres:

